<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE721 Cryptography Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        .active-tab { background: var(--primary); color: #fff; box-shadow: 0 8px 20px #3b82f633; }
        .data-list::-webkit-scrollbar { width: 8px; height: 8px; }
        .data-list::-webkit-scrollbar-track { background: var(--panel-deep); border-radius: 8px; }
        .data-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        .data-list::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        #des-key, #aes-key, #sub-key { font-family: monospace; letter-spacing: .08em; }
        .crypto-card input, .crypto-card select { height: 44px; padding: .625rem 1rem; line-height: 1.25rem; }
        .crypto-card textarea { min-height: 96px; padding: .75rem 1rem; line-height: 1.5rem; letter-spacing: .02em; }
        .crypto-card input::placeholder, .crypto-card textarea::placeholder { color: #94a3b8; opacity: .9; }
        nav button { min-height: 44px; padding: .625rem 1rem; line-height: 1.25rem; font-size: .875rem; }
        .primary-button, .secondary-button, .danger-button { min-height: 44px; padding: .75rem 1rem; line-height: 1.25rem; font-size: .875rem; letter-spacing: 0; }
        .link-button { min-height: 28px; padding: .25rem .5rem; line-height: 1rem; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-black text-xl tracking-tight">C721</div>
            <div>
                <h1 class="text-sm font-bold text-white sm:text-base">CSE721: Introduction to Cryptography</h1>
                <p class="text-[10px] text-slate-400 sm:text-xs">Implementation and security analysis</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <nav class="flex flex-wrap gap-2 p-1 bg-slate-900 rounded-xl border border-slate-800/80 mb-6 max-w-2xl">
            <button onclick="switchTab('classical')" id="tab-btn-classical" class="active-tab flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm text-white">Classical Cryptography</button>
            <button onclick="switchTab('symmetric')" id="tab-btn-symmetric" class="flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm text-slate-300 hover:text-white">Symmetric-Key</button>
            <button onclick="switchTab('publickey')" id="tab-btn-publickey" class="flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm text-slate-300 hover:text-white">Public-Key</button>
        </nav>

        {% include 'partials/classical_tab.html' %}
        {% include 'partials/symmetric_tab.html' %}
        {% include 'partials/public_key_tab.html' %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
