<section id="tab-publickey" class="tab-panel stack-panel hidden">
  <article class="crypto-card"><h2>RSA and Fermat Attack</h2><p>Generate keys, encrypt messages, decrypt ciphertext, and test factorization.</p>
    <div class="two-column"><div><label for="rsa-bits">Prime bit size</label><select id="rsa-bits"><option value="32">32-bit</option><option value="64">64-bit</option><option value="128" selected>128-bit</option><option value="256">256-bit</option><option value="512">512-bit</option></select></div><div class="button-align"><button class="primary-button" onclick="generateRsaKeys()">Generate key pair</button></div></div>
    <div id="rsa-error" class="error-message hidden"></div><div class="key-grid"><div><label>p</label><input id="rsa-p" readonly value="Uninitialized"></div><div><label>q</label><input id="rsa-q" readonly value="Uninitialized"></div><div><label>N</label><input id="rsa-n" readonly value="Uninitialized"></div><div><label>e</label><input id="rsa-e" readonly value="65537"></div><div><label>d</label><input id="rsa-d" readonly value="Uninitialized"></div></div>
    <label for="rsa-plaintext">Plaintext</label><input id="rsa-plaintext" placeholder="Enter plaintext string"><div class="button-row"><button class="primary-button" onclick="runRsaEncrypt()">Encrypt</button><button class="secondary-button" onclick="runRsaDecrypt()">Decrypt</button></div>
    <label for="rsa-ciphertext-bin">Ciphertext</label><textarea id="rsa-ciphertext-bin" rows="2" placeholder="Hex, integer, or list"></textarea><div id="rsa-output-card" class="result-panel hidden"><label>Encrypted values</label><output id="rsa-hex-output"></output><output id="rsa-int-output"></output><output id="rsa-array-output"></output><div id="rsa-decrypted-card" class="hidden"><label>Decrypted message</label><output id="rsa-decrypted-output"></output></div></div>
    <div class="attack-row"><button class="danger-button" onclick="simulateFermatAttack()">Launch Fermat attack</button><span id="fermat-loading" class="hidden">Searching...</span></div><div id="fermat-output" class="data-list">Awaiting execution.</div>
  </article>
  <article class="crypto-card"><h2>ECC and ECDH</h2><p>Validate a curve, list subgroup points, and calculate a shared exchange key.</p>
    <div class="three-column"><div><label>p</label><input id="ecc-p" type="number" value="17"></div><div><label>a</label><input id="ecc-a" type="number" value="2"></div><div><label>b</label><input id="ecc-b" type="number" value="2"></div></div><div class="two-column"><div><label>Gx</label><input id="ecc-gx" type="number" value="5"></div><div><label>Gy</label><input id="ecc-gy" type="number" value="1"></div></div><button class="primary-button" onclick="validateEccParams()">Validate curve</button>
    <div class="two-column"><div><label>Primitive Px</label><input id="ecc-px" type="number" value="5"></div><div><label>Primitive Py</label><input id="ecc-py" type="number" value="1"></div><div><label>Alice private</label><input id="ecc-alice-priv" type="number" value="3"></div><div><label>Bob private</label><input id="ecc-bob-priv" type="number" value="5"></div></div><button class="secondary-button" onclick="runEccExchange()">Process ECDH exchange</button><div id="ecc-error" class="error-message hidden"></div><div id="ecc-log-summary" class="result-panel">Curves uninitialized.</div><div id="ecc-multiples" class="data-list">No subgroup list yet.</div>
  </article>
</section>
